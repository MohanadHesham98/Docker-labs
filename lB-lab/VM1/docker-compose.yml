version: "3.8"

services:
  frontend1:
    build: .
    container_name: frontend1
    ports:
      - "8080:80"
    restart: always

  loadbalancer:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx-lb/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend1
    restart: always
