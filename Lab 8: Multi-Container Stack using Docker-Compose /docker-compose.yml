version: '3.8'

services:
  # --------------------------------------------------------
  # Database Tier: MongoDB
  # --------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: mental-health-db
    restart: always
    environment:
      MONGO_INITDB_DATABASE: mental_health_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Application Tier: Node.js Express App
  # --------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mental-health-api
    restart: always
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/mental_health_db
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-net

  # --------------------------------------------------------
  # Web Server Tier: Nginx Reverse Proxy
  # --------------------------------------------------------
  web:
    image: nginx:alpine
    container_name: mental-health-web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - app-net

# ----------------------------------------------------------
# Persistent Storage Volumes
# ----------------------------------------------------------
volumes:
  mongodb_data:
    driver: local

# ----------------------------------------------------------
# Custom Isolated Bridge Network
# ----------------------------------------------------------
networks:
  app-net:
    driver: bridge
